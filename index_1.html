<!DOCTYPE html>
<html lang="ru">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>План промо</title>
<meta charset="utf-8">
<style>
:root{--navy:#1f3a5f;--navy2:#2c4f7c;--bg:#f4f6f9;--card:#fff;--line:#e3e7ee;--muted:#6b7686;--ink:#1c2430;
--ban:#3d7be0;--pop:#2fa36b;--push:#e08a1e;--placed:#2f8a4a;--plan:#1f3a5f;--warn:#b45f06;
--hl:#ffb547;--hlInk:#1c2430;--today:#fff7ec;--soft:#f0f3f8;--top:var(--navy);--topInk:#fff;--font:Inter,Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px}
header{background:var(--navy);color:#fff;padding:0}
.top{background:var(--top);color:var(--topInk);padding:14px 24px}
nav{padding:0 24px}
.logo{height:40px;width:auto;display:block}
.brand{color:var(--topInk)}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-weight:700;font-size:20px;letter-spacing:.2px}
.brand small{display:block;font-weight:400;font-size:12px;opacity:.75;margin-top:2px}
.sp{flex:1}
select.site{background:var(--navy2);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:6px 10px;font:inherit}
.upd{font-size:12px;opacity:.8}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{background:none;border:0;color:rgba(255,255,255,.78);font:500 14px var(--font);padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:#fff;border-bottom-color:var(--hl)}
main{max-width:1280px;margin:0 auto;padding:20px 16px 60px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;cursor:pointer;font:500 13px var(--font);color:var(--ink)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
input.search{border:1px solid var(--line);border-radius:20px;padding:7px 14px;font:inherit;min-width:220px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:22px;color:var(--navy)}
.stat span{font-size:12px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:16px;line-height:1.3}
.meta{font-size:12px;color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:10px}
.st-размещено{background:#e3f3e8;color:var(--placed)}.st-запланировано{background:#e6edf7;color:var(--plan)}.st-уточняется{background:#fdf0e1;color:var(--warn)}
.tag{font-size:13px;line-height:1.45;color:#38424f;white-space:pre-line}
.fmt{display:grid;grid-template-columns:78px 1fr;gap:4px 10px;font-size:13px}
.fmt .k{color:var(--muted);font-size:12px;padding-top:1px}
.fmt .v{white-space:pre-line}
.kpi{display:flex;gap:14px;font-size:12px;color:var(--muted)}.kpi b{color:var(--ink);font-size:14px}
textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:13px var(--font);resize:vertical;min-height:38px;background:#fffdf3}
.row{display:flex;gap:8px;align-items:center}
.btn{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:7px 14px;font:600 13px var(--font);cursor:pointer}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.ok{color:var(--placed);font-size:12px}.err{color:#c62828;font-size:12px}
.card .cm{margin-top:auto}
.cml{font-size:11px;color:var(--muted,#6b7686);margin:6px 0 3px}.reply{margin-top:8px;padding:8px 10px;border-left:3px solid var(--plan,#1f3a5f);background:var(--soft,#eef2f7);font-size:13px;border-radius:4px;white-space:pre-wrap}
.card.svc{background:#f6f7f9}.card.svc h3{color:var(--muted)}
.seg.svc{background:#b7bcc4}
h5.grp{margin:22px 0 10px;font-size:14px;color:var(--muted)}
.lst{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:auto}
.lst table{width:100%;border-collapse:collapse;font-size:13px}
.lst th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:9px 12px;background:var(--soft);white-space:nowrap}
.lst td{padding:9px 12px;border-top:1px solid #eef1f5;vertical-align:top;white-space:pre-line}
.lst td.n{font-weight:600;min-width:180px}.lst td.k{font-weight:700;text-align:right;white-space:nowrap}.lst th.k{text-align:right}
.lst td.k.no{color:#c3c9d2;font-weight:400}
.sp2{flex:1}
.empty{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:30px;text-align:center;color:var(--muted)}
/* календарь */
.gwrap{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:auto}
table.g{border-collapse:collapse;font-size:12px;min-width:100%}
table.g th,table.g td{border-bottom:1px solid #eef1f5;padding:0;height:26px}
table.g th{position:sticky;top:0;background:var(--navy);color:#fff;font-weight:500;font-size:11px;min-width:26px}
table.g th.we{background:var(--navy2)}table.g th.td{background:var(--hl);color:var(--hlInk)}
table.g td.t,table.g th.t{width:240px;min-width:240px;max-width:240px}
table.g td.t{position:sticky;left:0;background:#fff;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;z-index:1;border-right:1px solid var(--line)}
table.g td.src{position:sticky;left:240px;width:130px;min-width:130px;max-width:130px;background:#fff;color:var(--muted);padding:0 8px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--line)}
table.g td.inf{position:sticky;left:370px;width:120px;min-width:120px;max-width:120px;background:#fff;color:var(--muted);padding:0 8px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.g td.f{position:sticky;left:490px;background:#fff;color:var(--muted);padding:0 8px;font-size:11px;white-space:nowrap;border-right:1px solid var(--line)}
td.d{min-width:26px;position:relative}
.pos{display:inline-block;min-width:22px;text-align:center;font-weight:700;color:#fff;background:var(--navy);border-radius:6px;padding:0 5px;margin-right:6px;font-size:11px}
tr.past td.t{color:var(--muted);font-weight:400}
tr.gap td{border-top:2px solid var(--line)}
td.d.today{background:var(--today)}
.seg{position:absolute;top:5px;bottom:5px;left:0;right:0}
.seg.ban{background:var(--ban)}.seg.pop{background:var(--pop)}.seg.push{background:var(--push);left:6px;right:6px;border-radius:50%}
.seg.push.set{box-shadow:inset 0 0 0 2px var(--navy)}.seg.push.sent{background:var(--placed)}.seg.push.cx{background:#d9dce1;opacity:.55}.seg.push.late{background:#0f8b8d}.card.miss{opacity:.6}.card.miss:hover{opacity:1}.sep{margin:18px 0 8px;font-weight:600;color:var(--muted)}
.seg.s{border-top-left-radius:5px;border-bottom-left-radius:5px;left:2px}.seg.e{border-top-right-radius:5px;border-bottom-right-radius:5px;right:2px}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 20px;font-size:12px;color:var(--muted);margin:10px 0} /* 19l: в строку с переносом, подписи не ломаются */
.legend>span{display:inline-flex;align-items:center;white-space:nowrap}
.legend i{display:inline-block;flex:none;width:14px;height:10px;border-radius:3px;margin-right:6px}
.legend .pos{margin-right:6px}
/* витрина, push, предложения */
.lenta{display:flex;gap:10px;overflow-x:auto;padding:14px 16px}
.lc{flex:0 0 150px;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.lp{align-self:flex-start;color:#fff;font-weight:700;border-radius:8px;padding:2px 9px;font-size:13px}
.lt{font-weight:600;font-size:13px;line-height:1.3;min-height:34px}
.lb{height:6px;background:#eef1f5;border-radius:3px;overflow:hidden}.lb i{display:block;height:100%}
.lpc{font-weight:700;font-size:13px}
.sec{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
.sec h4{margin:0;padding:12px 16px;background:var(--soft);color:var(--navy);font-size:14px}
.sec table{width:100%;border-collapse:collapse;font-size:13px}
.sec td{padding:7px 12px;border-top:1px solid #eef1f5;vertical-align:top}
.sec tr.h td{font-weight:600;color:var(--muted);font-size:12px}
.push{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.pbot{margin-top:auto;display:flex;flex-direction:column;gap:10px} /* 19n: отметка, комментарий и кнопка — у нижнего края карточки */
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#f3f5f9;padding:3px 6px;border-radius:6px;word-break:break-all}
form.prop{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:18px}
form.prop label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
form.prop input,form.prop select{border:1px solid var(--line);border-radius:8px;padding:8px;font:13px var(--font)}
.wide{grid-column:1/-1}
.loading{padding:60px;text-align:center;color:var(--muted)}
@media(max-width:600px){table.g td.t,table.g th.t{width:150px;min-width:150px;max-width:150px}.top{padding:12px 14px}nav{padding:0 14px}.logo{height:30px}.cards,.push{grid-template-columns:1fr}table.g td.f,table.g td.src,table.g td.inf{display:none}}
.who{font-size:12px;color:var(--topInk,#fff);display:flex;align-items:center;gap:6px;margin-right:10px}.who input{font:inherit;padding:4px 8px;border:1px solid #ccc;border-radius:6px;width:150px;color:#1c2430}
</style>

</head>
<body>
<header>
  <div class="top">
    <span id="logoSlot"></span><div class="brand">План промо · <span id="siteName"></span><small>Lifestream · баннеры, popup и push на вашей платформе</small></div>
    <div class="sp"></div>
    <label class="who">Ваше имя <input id="who" maxlength="60" placeholder="для подписи комментариев"></label>
    <select class="site" id="site" style="display:none"></select>
    <div class="upd" id="upd"></div>
  </div>
  <nav id="nav"></nav>
</header>
<main id="main"><div class="loading">Загружаем план…</div></main>

<script>
/* 19r. Замена google.script.run: GET к веб-приложению без cookies — работает при нескольких Google-аккаунтах в браузере */
var API = 'https://script.google.com/macros/s/AKfycbx-zxX61Ur7BSWDLnlcCfTFGeIbmQ8ElYGD7d_edu2pGvB-ZYa-bc9ixjn3sCYn_6zR/exec';
function gsr() {
  var ok = function () {}, er = function (e) { alert(e.message); }, o = { withSuccessHandler: function (f) { ok = f; return o; }, withFailureHandler: function (f) { er = f; return o; } };
  ['pw_init', 'pw_data', 'pw_comment', 'pw_push', 'pw_propose', 'pw_url'].forEach(function (n) {
    o[n] = function () { var a = [].slice.call(arguments);
      fetch(API + '?api=' + n + '&a=' + encodeURIComponent(JSON.stringify(a)), { credentials: 'omit', redirect: 'follow' })
        .then(function (r) { return r.json(); })
        .then(function (j) { if (j.ok) ok(j.res); else er(new Error(j.err)); })
        .catch(function () { er(new Error('нет связи с сервером — обновите страницу')); }); };
  });
  return o;
}
var P = '', PS = '', PK = '', CODE = '', SITES = [], D = null, TAB = 'plan', MI = 0, FLT = 'all', Q = '', CF = 'all', VIEW = 'cards';
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
var $ = function (id) { return document.getElementById(id); };

function boot() {
  if (SITES.length > 1) {
    var s = $('site'); s.style.display = '';
    s.innerHTML = SITES.map(function (x) { return '<option value="' + x.k + '"' + (x.k === PS ? ' selected' : '') + '>' + esc(x.name) + '</option>'; }).join('');
    s.onchange = function () { gsr().withSuccessHandler(function (u) { var h = CODE + '/' + s.value; if (location.search) location.href = location.pathname + '#' + h; else { location.hash = h; location.reload(); } }).pw_url(); };
  }
  try { $('who').value = localStorage.getItem('pw_who') || ''; } catch (e) {}
  $('who').onchange = function () { try { localStorage.setItem('pw_who', this.value.trim()); } catch (e) {} };
  load();
}
(function () { // площадка и оформление по ссылке: #код[/площадка] (26b) или старое ?s=…&k=…
  var q = new URLSearchParams(location.search), h = decodeURIComponent(location.hash.slice(1)).split('/');
  var s0 = q.get('s') || h[1] || '', k0 = q.get('k') || h[0] || '';
  if (!k0) { document.body.innerHTML = '<div style="font:18px Arial;padding:48px 32px;color:#1f3a5f;max-width:600px;line-height:1.5">Привет! Чтобы открыть вашу партнёрскую страницу, ' +
    'введите полную ссылку. Если потеряли — обратитесь к коллегам из Лайфстрим.</div>'; document.title = 'План промо'; return; }
  gsr().withSuccessHandler(function (i) {
    P = i.p; PS = P.split(':')[0]; PK = P.slice(PS.length + 1); CODE = i.code || PK; SITES = i.sites;
    document.title = 'План промо — ' + i.site; document.head.insertAdjacentHTML('beforeend', (i.font || '') + (i.themeCss || ''));
    $('logoSlot').outerHTML = i.logo || ''; $('siteName').textContent = i.site; boot();
  }).withFailureHandler(function (e) {
    document.body.innerHTML = '<div style="font:16px Arial;padding:40px;color:#1f3a5f;max-width:560px">' + esc(e.message) + '</div>';
  }).pw_init(s0, k0);
})();
/** 18b. Имя для подписи; пусто — просим заполнить и не сохраняем. */
function who(s) {
  var w = $('who').value.trim();
  if (!w) { s.className = 'err'; s.textContent = 'Укажите ваше имя вверху страницы'; $('who').focus(); }
  return w;
}

function load() {
  gsr().withSuccessHandler(function (d) { D = d; var now = new Date();
    MI = Math.max(0, D.months.findIndex(function (m) { return m.y === now.getFullYear() && m.m === now.getMonth(); }));
    $('upd').textContent = D.updated ? 'обновлено ' + D.updated : ''; if (D.ro && !D.push && !D.props) $('who').parentNode.style.display = 'none'; nav(); render(); })
  .withFailureHandler(function (e) { $('main').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; }).pw_data(P);
}
function nav() {
  var t = [['plan', 'План'], ['cal', 'Календарь'], ['day', 'Витрина сегодня']];
  if (D.push) t.push(['push', 'Push к отправке']);
  if (D.props) t.push(['props', 'Предложить тайтл']);
  t.push(['help', 'Как пользоваться']);
  $('nav').innerHTML = t.map(function (x) { return '<button class="' + (x[0] === TAB ? 'on' : '') + '" onclick="TAB=\'' + x[0] + '\';nav();render()">' + x[1] + '</button>'; }).join('');
}
function render() { ({ plan: rPlan, cal: rCal, day: rDay, push: rPush, props: rProps, help: rHelp })[TAB](); }
function monthBar() {
  return D.months.map(function (m, i) { return '<button class="chip' + (i === MI ? ' on' : '') + '" onclick="MI=' + i + ';render()">' + esc(m.name) + '</button>'; }).join('');
}

/* ── План ── */
function rPlan() {
  var m = D.months[MI]; if (!m) { $('main').innerHTML = '<div class="empty">План пока пуст</div>'; return; }
  var isSvc = function (r) { return r['Сущность'] === 'служебное уведомление'; };
  var all = m.rows; m = { name: m.name, y: m.y, m: m.m, rows: all.filter(function (r) { return !isSvc(r); }) };
  var svcRows = all.filter(isSvc);
  var rows = m.rows.filter(function (r) {
    if (FLT !== 'all' && r['Статус'] !== FLT) return false;
    if (Q && (r['Название'] + ' ' + r['Источник']).toLowerCase().indexOf(Q.toLowerCase()) < 0) return false; return true; });
  var cnt = function (k) { return m.rows.filter(function (r) { return r[k]; }).length; };
  var h = '<div class="bar">' + monthBar() + '</div>';
  h += '<div class="stats"><div class="stat"><b>' + m.rows.length + '</b><span>тайтлов в плане</span></div><div class="stat"><b>' + cnt('Баннеры') + '</b><span>с баннерами</span></div>' +
    '<div class="stat"><b>' + cnt('Popup') + '</b><span>с popup</span></div><div class="stat"><b>' + cnt('Push') + '</b><span>с push</span></div>' +
    '<div class="stat"><b>' + m.rows.filter(function (r) { return r['Статус'] === 'размещено'; }).length + '</b><span>уже размещено</span></div></div>';
  h += '<div class="bar">' + [['all', 'Все'], ['запланировано', 'Запланировано'], ['размещено', 'Размещено']].map(function (x) {
    return '<button class="chip' + (FLT === x[0] ? ' on' : '') + '" onclick="FLT=\'' + x[0] + '\';render()">' + x[1] + '</button>'; }).join('') +
    '<input class="search" placeholder="Поиск по названию или источнику" value="' + esc(Q) + '" oninput="Q=this.value;clearTimeout(window._q);window._q=setTimeout(render,250)">' +
    '<span class="sp2"></span>' + [['cards', 'Карточки'], ['list', 'Списком']].map(function (x) {
    return '<button class="chip' + (VIEW === x[0] ? ' on' : '') + '" onclick="VIEW=\'' + x[0] + '\';render()">' + x[1] + '</button>'; }).join('') + '</div>';
  var svcH = svcRows.length && FLT === 'all' && !Q ? '<h5 class="grp">Служебные уведомления — не промо, показаны для справки</h5>' +
    '<div class="lst"><table><tr><th>Уведомление</th><th>Показ</th></tr>' + svcRows.map(function (r) { return '<tr><td class="n">' + esc(r['Название']) + '</td><td>' + esc(r['Popup']) + '</td></tr>'; }).join('') + '</table></div>' : '';
  if (!rows.length) { $('main').innerHTML = h + '<div class="empty">Ничего не найдено</div>' + svcH; return; }
  if (VIEW === 'list') {
    var K = [['Баннеры: CTR', 'CTR баннеров'], ['Popup: CTR', 'CTR popup'], ['Push: open rate', 'Open rate push']];
    var c = function (v) { return '<td>' + (v ? esc(v) : '<span class="meta">—</span>') + '</td>'; };
    h += '<div class="lst"><table><tr><th>Тайтл</th><th>Источник</th><th>Статус</th><th>Баннеры</th><th>Popup</th><th>Push</th>' +
      K.map(function (x) { return '<th class="k">' + x[1] + '</th>'; }).join('') + '</tr>' +
      rows.map(function (r) {
        return '<tr><td class="n">' + esc(r['Название']) + '</td>' + c(r['Источник']) + '<td><span class="pill st-' + esc(r['Статус']) + '">' + esc(r['Статус']) + '</span></td>' +
          c(r['Баннеры']) + c(r['Popup']) + c(r['Push']) +
          K.map(function (x) { return r[x[0]] ? '<td class="k">' + esc(r[x[0]]) + '</td>' : '<td class="k no">—</td>'; }).join('') + '</tr>';
      }).join('') + '</table></div>';
    $('main').innerHTML = h + svcH; return;
  }
  h += '<div class="cards">' + rows.map(function (r, i) {
    var f = function (k, l) { return r[k] ? '<div class="k">' + l + '</div><div class="v">' + esc(r[k]) + '</div>' : ''; };
    var kp = [['Баннеры: CTR', 'CTR баннеров'], ['Popup: CTR', 'CTR popup'], ['Push: open rate', 'open rate push']].filter(function (x) { return r[x[0]]; });
    return '<div class="card"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><h3>' + esc(r['Название']) + '</h3>' +
      '<div class="meta">' + esc([r['Источник'], r['Сущность'], r['Год'], r['Дата релиза'] && 'релиз ' + r['Дата релиза'], INF(r)].filter(String).join(' · ')) + '</div></div>' +
      '<span class="pill st-' + esc(r['Статус']) + '">' + esc(r['Статус']) + '</span></div>' +
      (DSC(r) ? '<div class="tag">' + esc(DSC(r)) + '</div>' : '') +
      '<div class="fmt">' + f('Баннеры', 'Баннеры') + f('Popup', 'Popup') + f('Push', 'Push') + '</div>' +
      (kp.length ? '<div class="kpi">' + kp.map(function (x) { return '<span><b>' + esc(r[x[0]]) + '</b> ' + x[1] + '</span>'; }).join('') + '</div>' : '') +
      (r['Ответ Lifestream'] ? '<div class="reply"><b>Ответ Lifestream:</b> ' + esc(r['Ответ Lifestream']) + '</div>' : '') +

  h += '<div class="sec"><h4>Ваши предложения</h4>' + (D.props.length ? '<table><tr class="h"><td>Релиз</td><td>Тайтл</td><td>Форматы</td><td>Комментарий (автор)</td><td>Статус</td></tr>' +
    D.props.slice().reverse().map(function (x) { return '<tr><td>' + esc(x.rel) + '</td><td><b>' + esc(x.title) + '</b><div class="meta">' + esc(x.src) + '</div></td><td>' + esc(x.fmt || 'ВБ') + '</td><td class="meta">' + esc(x.note || '') + '</td><td>' +
      '<span class="pill ' + (/^принято/.test(x.st) ? 'st-размещено' : /не берём/.test(x.st) ? 'st-уточняется' : 'st-запланировано') + '">' + esc(x.st || 'отправлено, ждёт обработки') + '</span></td></tr>'; }).join('') + '</table>'
    : '<div style="padding:12px 16px" class="meta">Пока нет</div>') + '</div>';
  h += '<div class="meta">Статусы: «получено ДД.ММ» — увидели; «принято: …» — берём, перечислены запланированные форматы с датами; «принято, даты уточняем»; «не берём». Принятый тайтл появится во вкладке «План» своего месяца.</div>';
  $('main').innerHTML = h;
}
function propose(ev) {
  ev.preventDefault(); var f = ev.target, o = {}, s = $('pp'), w = who(s); if (!w) return;
  ['rel', 'src', 'title', 'ent', 'info', 'fmt', 'link', 'note'].forEach(function (k) { o[k] = f[k].value; });
  s.className = ''; s.textContent = 'отправляем…';
  gsr().withSuccessHandler(function () { D.props.push({ rel: o.rel.split('-').reverse().join('.'), src: o.src, title: o.title, fmt: o.fmt, note: (o.note ? o.note + ' — ' : '— ') + w, st: '' }); rProps(); $('pp').className = 'ok'; $('pp').textContent = '✓ предложение отправлено'; })
    .withFailureHandler(function (e) { s.className = 'err'; s.textContent = e.message; }).pw_propose(P, o, w);
}

/* ── Справка ── */
function rHelp() {
  $('main').innerHTML = '<div class="sec"><h4>Как пользоваться</h4><div style="padding:14px 18px;line-height:1.6">' +
    '<p><b>План</b> — что мы продвигаем в месяце: баннеры (карусель, главная премьера, стрип; «м.N» — место), popup (даты показа), push (дата и время). Статус «запланировано» — ещё не началось, «размещено» — хотя бы один формат уже идёт или прошёл. CTR и open rate появляются после размещения.</p>' +
    (D.ro ? '' : '<p><b>Комментарий</b> — под каждым тайтлом. Мы видим его в своём плане и ответим правкой или письмом.</p>') +
    '<p><b>Календарь</b> — те же форматы по дням месяца. <b>Витрина сегодня</b> — что фактически стоит на главном экране.</p>' +
    (D.push ? '<p><b>Push к отправке</b> — готовые тексты и диплинки; кампанию в AppMetrica называйте как в карточке, после отправки отметьте «Отправлено».</p>' : '') +
    (D.props ? '<p><b>Предложить тайтл</b> — форма и список ваших предложений со статусами.</p>' : '') +
    '<p class="meta">Показано только запланированное. Данные обновляются несколько раз в день (время — справа вверху).</p></div></div>';
}
